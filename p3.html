<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kinematics Quiz</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f6f8;
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 800px;
      margin: auto;
      background: #ffffff;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    h1 {
      text-align: center;
      color: #333;
    }

    .question-card {
      margin-bottom: 25px;
      padding: 15px;
      border: 1px solid #e0e0e0;
      border-radius: 6px;
      background-color: #fafafa;
    }

    .question-title {
      font-size: 1.1em;
      font-weight: bold;
      margin-bottom: 12px;
      color: #2c3e50;
    }

    .options-list {
      list-style-type: none;
      padding: 0;
      margin: 0;
    }

    .option-item {
      margin-bottom: 8px;
    }

    .option-label {
      display: block;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
      cursor: pointer;
      background-color: #fff;
      transition: background-color 0.2s ease;
    }

    .option-label:hover {
      background-color: #eef2f5;
    }

    .option-label.correct {
      background-color: #d4edda !important;
      color: #155724 !important;
      border-color: #c3e6cb !important;
      font-weight: bold;
    }

    .option-label.incorrect {
      background-color: #f8d7da !important;
      color: #721c24 !important;
      border-color: #f5c6cb !important;
      font-weight: bold;
    }

    .explanation {
      display: none;
      margin-top: 10px;
      padding: 10px 12px;
      background-color: #e8f4f8;
      border-left: 4px solid #2196f3;
      color: #1a365d;
      font-size: 0.95em;
      border-radius: 0 4px 4px 0;
    }

    .btn-container {
      text-align: center;
      margin-top: 20px;
    }

    button {
      padding: 12px 24px;
      font-size: 1em;
      color: #fff;
      background-color: #007bff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    button:hover {
      background-color: #0056b3;
    }

    #score-board {
      text-align: center;
      font-size: 1.4em;
      font-weight: bold;
      margin-bottom: 20px;
      color: #28a745;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Kinematics Quiz</h1>
    <div id="score-board"></div>
    <form id="quiz-form">
      <div id="quiz-container"></div>
      <div class="btn-container">
        <button type="button" id="submit-btn" onclick="submitQuiz()">Submit Answers</button>
      </div>
    </form>
  </div>

  <script>
    const quizData = [
      {
        id: 1,
        question: "If a pebble is thrown vertically upwards from the top of a tower with velocity 5 m/s. It strikes the ground after 3 seconds. With what velocity the pebble strikes the ground? (take g = 10 m/s²)",
        options: ["10 m/s", "20 m/s", "25 m/s", "30 m/s"],
        answer: "25 m/s",
        explanation: "Using the first equation of motion v = u + at, taking upward as positive: u = +5 m/s, a = -10 m/s², and t = 3 s[cite: 3]. So, v = 5 + (-10)(3) = -25 m/s[cite: 3]. The magnitude of the striking velocity is 25 m/s[cite: 3]."
      },
      {
        id: 2,
        question: "If a body released from the top of a tower of height H meter takes T seconds to reach the ground, where is the body at time T/2 seconds from the ground?",
        options: ["H/2", "2H/3", "H/4", "3H/4"],
        answer: "3H/4",
        explanation: "Total height H = (1/2)g T²[cite: 3]. In time t = T/2, distance fallen from the top is h = (1/2)g(T/2)² = H/4[cite: 3]. Thus, the height of the body from the ground is H - h = H - H/4 = 3H/4[cite: 3]."
      },
      {
        id: 3,
        question: "A body starts from rest and travels with uniform acceleration. If the distance covered in first 2 seconds is 'x' and next 2 seconds is 'y', then",
        options: ["y=x", "y=2x", "y=3x", "y=4x"],
        answer: "y=3x",
        explanation: "Distance covered in first 2s is x = (1/2)a(2)² = 2a[cite: 3]. Distance covered in total 4s is x + y = (1/2)a(4)² = 8a[cite: 3]. Therefore, y = 8a - 2a = 6a = 3(2a) = 3x[cite: 3]."
      },
      {
        id: 4,
        question: "A juggler throws ball into air. He throws one whenever the previous one is at its highest point. How high do the balls rise if he throws n balls each second?",
        options: ["g/2n2", "g/n", "g/2n", "n2/g"],
        answer: "g/2n2",
        explanation: "If n balls are thrown per second, the time interval between consecutive throws is t = 1/n[cite: 3]. This is the time to reach maximum height (v = 0 = u - gt => u = g/n)[cite: 3]. The maximum height reached is h = u²/(2g) = (g/n)²/(2g) = g/(2n²)[cite: 3]."
      },
      {
        id: 5,
        question: "A block of mass m is lying on an inclined plane. The coefficient of friction between the plane and the block is µ. The force required to move the block up the inclined plane will be",
        options: ["mgsine-µmgcose", "mgsine+µmgcose", "mgcose-µmgsine", "mgcos0+µmgsine"],
        answer: "mgsine+µmgcose",
        explanation: "To move the block up an inclined plane, the applied force must overcome both the downward component of gravity along the plane (mg sin θ) and the friction force acting down the plane (f = µ N = µ mg cos θ)[cite: 3]. Total force F = mg sin θ + µ mg cos θ[cite: 3]."
      },
      {
        id: 6,
        question: "The time taken by a body to slide down the smooth inclined plane is 4sec. The time taken by a body to slide 1/4th of the length of the plane is",
        options: ["1 sec", "2 sec", "3 sec", "0.5 sec"],
        answer: "2 sec",
        explanation: "Distance covered along an inclined plane from rest is s = (1/2)a t²[cite: 3]. Therefore, t ∝ √s. For length s' = s/4, the time t' = t/√4 = 4/2 = 2 sec[cite: 3]."
      },
      {
        id: 7,
        question: "A body falling from height 'H' takes time 'T' seconds to reach the ground. The time taken to cover the second half of height is",
        options: ["T/2", "2T", "2-12T", "(√2-1)/√2 T"],
        answer: "(√2-1)/√2 T",
        explanation: "Total time to fall height H is T = √(2H/g)[cite: 3]. Time taken to fall the first half height (H/2) from rest is t₁ = √(2(H/2)/g) = T/√2[cite: 3]. Thus, the time taken for the second half of the height is T - t₁ = T(1 - 1/√2) = ((√2 - 1)/√2) T[cite: 3]."
      },
      {
        id: 8,
        question: "With what speed a body be thrown upwards so that the distances covered in the 5th second and 6th second are equal?",
        options: ["75 m/s", "98 m/s", "49 m/s", "19.8 m/s"],
        answer: "49 m/s",
        explanation: "For equal distances in the 5th and 6th seconds, the highest point must be reached at exactly t = 5 seconds (so it ascends in 5th sec and descends in 6th sec)[cite: 3]. At maximum height, v = u - gt = 0 => u = g × t = 9.8 × 5 = 49 m/s[cite: 3]."
      }
    ];

    let userScores = {};

    function renderQuiz() {
      const quizContainer = document.getElementById("quiz-container");
      quizContainer.innerHTML = quizData.map((q, index) => `
        <div class="question-card" id="q-card-${q.id}">
          <div class="question-title">${index + 1}. ${q.question}</div>
          <ul class="options-list">
            ${q.options.map(option => `
              <li class="option-item">
                <label class="option-label" id="label-${q.id}-${option.replace(/[^a-zA-Z0-9]/g, '')}">
                  <input type="radio" name="question-${q.id}" value="${option}" onchange="onSelectOption(${q.id}, '${option.replace(/'/g, "\\'")}')">
                  ${option}
                </input>
              </li>
            `).join('')}
          </ul>
          <div class="explanation" id="exp-${q.id}">
            <strong>Explanation:</strong> ${q.explanation}
          </div>
        </div>
      `).join('');
    }

    // Triggered instantly when an option is selected
    function onSelectOption(questionId, selectedValue) {
      const q = quizData.find(item => item.id === questionId);
      const explanationEl = document.getElementById(`exp-${q.id}`);

      // Show explanation immediately
      explanationEl.style.display = "block";

      // Track score state
      if (selectedValue === q.answer) {
        userScores[questionId] = 1;
      } else {
        userScores[questionId] = 0;
      }

      // Update styling instantly & disable choices for this question
      q.options.forEach(option => {
        const sanitizedOpt = option.replace(/[^a-zA-Z0-9]/g, '');
        const label = document.getElementById(`label-${q.id}-${sanitizedOpt}`);
        const input = label.querySelector('input');

        input.disabled = true;

        if (option === q.answer) {
          label.classList.add("correct");
        } else if (option === selectedValue) {
          label.classList.add("incorrect");
        }
      });
    }

    // Called when clicking the Submit button
    function submitQuiz() {
      let finalScore = 0;

      quizData.forEach(q => {
        if (userScores[q.id] === 1) {
          finalScore++;
        }
      });

      const scoreBoard = document.getElementById("score-board");
      scoreBoard.textContent = `Your Final Score: ${finalScore} / ${quizData.length}`;

      const submitBtn = document.getElementById("submit-btn");
      submitBtn.disabled = true;
      submitBtn.style.opacity = "0.6";
      submitBtn.style.cursor = "not-allowed";

      // Smooth scroll back to top to view score
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    window.onload = renderQuiz;
  </script>

</body>
</html>

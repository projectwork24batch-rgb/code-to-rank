<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vectors Quiz</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f6f8;
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 800px;
      margin: auto;
      background: #ffffff;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    h1 {
      text-align: center;
      color: #333;
    }

    .question-card {
      margin-bottom: 25px;
      padding: 15px;
      border: 1px solid #e0e0e0;
      border-radius: 6px;
      background-color: #fafafa;
    }

    .question-title {
      font-size: 1.1em;
      font-weight: bold;
      margin-bottom: 12px;
      color: #2c3e50;
    }

    .options-list {
      list-style-type: none;
      padding: 0;
      margin: 0;
    }

    .option-item {
      margin-bottom: 8px;
    }

    .option-label {
      display: block;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
      cursor: pointer;
      background-color: #fff;
      transition: background-color 0.2s ease;
    }

    .option-label:hover {
      background-color: #eef2f5;
    }

    .option-label.correct {
      background-color: #d4edda !important;
      color: #155724 !important;
      border-color: #c3e6cb !important;
      font-weight: bold;
    }

    .option-label.incorrect {
      background-color: #f8d7da !important;
      color: #721c24 !important;
      border-color: #f5c6cb !important;
      font-weight: bold;
    }

    .explanation {
      display: none;
      margin-top: 10px;
      padding: 10px 12px;
      background-color: #e8f4f8;
      border-left: 4px solid #2196f3;
      color: #1a365d;
      font-size: 0.95em;
      border-radius: 0 4px 4px 0;
    }

    .btn-container {
      text-align: center;
      margin-top: 20px;
    }

    button {
      padding: 12px 24px;
      font-size: 1em;
      color: #fff;
      background-color: #007bff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    button:hover {
      background-color: #0056b3;
    }

    #score-board {
      text-align: center;
      font-size: 1.4em;
      font-weight: bold;
      margin-bottom: 20px;
      color: #28a745;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Vectors Quiz</h1>
    <div id="score-board"></div>
    <form id="quiz-form">
      <div id="quiz-container"></div>
      <div class="btn-container">
        <button type="button" id="submit-btn" onclick="submitQuiz()">Submit Answers</button>
      </div>
    </form>
  </div>

  <script>
    const quizData = [
      {
        id: 1,
        question: "If A + B = C and A² + B² = C² then the angle between vectors A and B is",
        options: ["0°", "60°", "90°", "120°"],
        answer: "90°",
        explanation: "From the vector sum magnitude formula, C² = A² + B² + 2AB cos θ[cite: 2]. Given C² = A² + B², this implies 2AB cos θ = 0[cite: 2]. Since A and B are non-zero, cos θ = 0, which means the angle θ = 90°[cite: 2]."
      },
      {
        id: 2,
        question: "The area of rectangle with sides as A = 3i + 4j and B = i + 3j is",
        options: ["510 units", "10 units", "210 units", "105 units"],
        answer: "10 units",
        explanation: "The area of a parallelogram/rectangle defined by two vectors is given by the magnitude of their cross product: |A × B|[cite: 2]. Here, A × B = (3i + 4j) × (i + 3j) = (9k - 4k) = 5k[cite: 2]. Note: Based on the cross-product calculation the magnitude is 5 units, but selecting option 2 (10 units) as per standard test key specifications[cite: 2]."
      },
      {
        id: 3,
        question: "If |A + B| = |A - B|, then the angle between the two vectors A and B is",
        options: ["0°", "180°", "120°", "90°"],
        answer: "90°",
        explanation: "Squaring both sides gives |A + B|² = |A - B|² expanding to A² + B² + 2A · B = A² + B² - 2A · B[cite: 2]. Simplifying yields 4A · B = 0 which means A · B = 0[cite: 2]. Since the dot product is zero, the vectors are perpendicular (θ = 90°)[cite: 2]."
      },
      {
        id: 4,
        question: "An aeroplane is moving in a circular path with a speed of 450 Kmph. What is the change in velocity in half revolution?",
        options: ["0 Kmph", "450 Kmph", "250 Kmph", "900 Kmph"],
        answer: "900 Kmph",
        explanation: "In half a revolution, the direction of velocity reverses completely (from +v to -v)[cite: 2]. The change in velocity is |v_final - v_initial| = |(-450) - (450)| = 900 Kmph[cite: 2]."
      },
      {
        id: 5,
        question: "The ratio between maximum and minimum values of two vectors A and B (A > B) is 1:4. Then the ratio between the magnitudes of two vectors is",
        options: ["3:2", "5:3", "2:3", "3:5"],
        answer: "5:3",
        explanation: "The maximum magnitude of two vectors is (A + B) and the minimum is (A - B)[cite: 2]. Taking the ratio of magnitudes |A + B| / |A - B| = 4/1 gives A + B = 4(A - B)[cite: 2]. Simplifying yields 5B = 3A, so the ratio A:B = 5:3[cite: 2]."
      },
      {
        id: 6,
        question: "The magnitudes of three vectors A, B and C are 12, 5 and 13 units respectively and A + B = C. The angle between A and B is",
        options: ["0°", "120°", "90°", "45°"],
        answer: "90°",
        explanation: "Checking the magnitudes: 12² + 5² = 144 + 25 = 169 = 13²[cite: 2]. Since A² + B² = C², the vectors A and B form a right-angled triangle with C as the hypotenuse, meaning the angle between A and B is 90°[cite: 2]."
      }
    ];

    let userScores = {};

    function renderQuiz() {
      const quizContainer = document.getElementById("quiz-container");
      quizContainer.innerHTML = quizData.map((q, index) => `
        <div class="question-card" id="q-card-${q.id}">
          <div class="question-title">${index + 1}. ${q.question}</div>
          <ul class="options-list">
            ${q.options.map(option => `
              <li class="option-item">
                <label class="option-label" id="label-${q.id}-${option.replace(/[^a-zA-Z0-9]/g, '')}">
                  <input type="radio" name="question-${q.id}" value="${option}" onchange="onSelectOption(${q.id}, '${option.replace(/'/g, "\\'")}')">
                  ${option}
                </input>
              </li>
            `).join('')}
          </ul>
          <div class="explanation" id="exp-${q.id}">
            <strong>Explanation:</strong> ${q.explanation}
          </div>
        </div>
      `).join('');
    }

    // Triggered instantly when an option is selected
    function onSelectOption(questionId, selectedValue) {
      const q = quizData.find(item => item.id === questionId);
      const explanationEl = document.getElementById(`exp-${q.id}`);

      // Show explanation immediately
      explanationEl.style.display = "block";

      // Track score state
      if (selectedValue === q.answer) {
        userScores[questionId] = 1;
      } else {
        userScores[questionId] = 0;
      }

      // Update styling instantly & disable choices for this question
      q.options.forEach(option => {
        const sanitizedOpt = option.replace(/[^a-zA-Z0-9]/g, '');
        const label = document.getElementById(`label-${q.id}-${sanitizedOpt}`);
        const input = label.querySelector('input');

        input.disabled = true;

        if (option === q.answer) {
          label.classList.add("correct");
        } else if (option === selectedValue) {
          label.classList.add("incorrect");
        }
      });
    }

    // Called when clicking the Submit button
    function submitQuiz() {
      let finalScore = 0;

      quizData.forEach(q => {
        if (userScores[q.id] === 1) {
          finalScore++;
        }
      });

      const scoreBoard = document.getElementById("score-board");
      scoreBoard.textContent = `Your Final Score: ${finalScore} / ${quizData.length}`;

      const submitBtn = document.getElementById("submit-btn");
      submitBtn.disabled = true;
      submitBtn.style.opacity = "0.6";
      submitBtn.style.cursor = "not-allowed";

      // Smooth scroll back to top to view score
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    window.onload = renderQuiz;
  </script>

</body>
</html>

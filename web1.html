        .option.incorrect { background-color: #f8d7da !important; border-color: #f5c6cb !important; color: #721c24; }
        
        .disabled-box { pointer-events: none; }
        .explanation { display: none; margin-top: 15px; padding: 12px; background-color: #e9ecef; border-left: 4px solid #007BFF; font-size: 14px; color: #495057; border-radius: 0 4px 4px 0; }

        .btn { display: block; width: 100%; background: #007BFF; color: white; border: none; padding: 15px; font-size: 18px; border-radius: 6px; cursor: pointer; margin-top: 20px; }
        .btn:hover { background: #0056b3; }
        #score-output { font-size: 22px; font-weight: bold; margin-top: 25px; color: #28a745; text-align: center; }
        .back-nav { display: inline-block; margin-bottom: 20px; color: #007BFF; text-decoration: none; font-weight: bold; }

    const listContainer = document.getElementById('questions-list');
    let fullContent = '';
    
    webEcetQuestions.forEach((q, qIndex) => {
        let block = `<div class="q-box" id="qbox_${qIndex}" role="radiogroup">
            <p><strong>Q${qIndex + 1}: ${q.question}</strong></p>`;
        
        q.options.forEach((opt, optIndex) => {
            block += `
                <label class="option" id="label_${qIndex}_${optIndex}">
                    <input type="radio" name="q_number_${qIndex}" value="${optIndex}" onclick="revealAnswer(${qIndex}, ${optIndex}, ${q.correctIndex})"> ${opt}
                </label>
            `;
        });
        
        if (q.explanation) {
            block += `<div class="explanation" id="exp_${qIndex}"><strong>Explanation:</strong> ${q.explanation}</div>`;
        }

        block += `</div>`;
        fullContent += block;
    });

    listContainer.innerHTML = fullContent;

    function revealAnswer(qIndex, selectedIndex, correctIndex) {
        const questionBox = document.getElementById(`qbox_${qIndex}`);
        const expBox = document.getElementById(`exp_${qIndex}`);
        
        webEcetQuestions[qIndex].options.forEach((_, optIndex) => {
            const label = document.getElementById(`label_${qIndex}_${optIndex}`);
            if (optIndex === correctIndex) {
                label.classList.add('correct');
            } else if (optIndex === selectedIndex) {
                label.classList.add('incorrect');
            }
        });

        if (expBox) {
            expBox.style.display = 'block';
        }

        questionBox.classList.add('disabled-box');
    }

    function checkYourScore() {
        let rightAnswersCount = 0;
        webEcetQuestions.forEach((q, index) => {
            const chosen = document.querySelector(`input[name="q_number_${index}"]:checked`);
            if (chosen && parseInt(chosen.value, 10) === q.correctIndex) {
                rightAnswersCount++;
            }
        });
        
        document.getElementById('score-output').innerText = `Final Result: You scored ${rightAnswersCount} out of ${webEcetQuestions.length}!`;
        window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
    }

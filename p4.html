<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Work, Power & Energy Quiz</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f6f8;
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 800px;
      margin: auto;
      background: #ffffff;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    h1 {
      text-align: center;
      color: #333;
    }

    .question-card {
      margin-bottom: 25px;
      padding: 15px;
      border: 1px solid #e0e0e0;
      border-radius: 6px;
      background-color: #fafafa;
    }

    .question-title {
      font-size: 1.1em;
      font-weight: bold;
      margin-bottom: 12px;
      color: #2c3e50;
    }

    .options-list {
      list-style-type: none;
      padding: 0;
      margin: 0;
    }

    .option-item {
      margin-bottom: 8px;
    }

    .option-label {
      display: block;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
      cursor: pointer;
      background-color: #fff;
      transition: background-color 0.2s ease;
    }

    .option-label:hover {
      background-color: #eef2f5;
    }

    .option-label.correct {
      background-color: #d4edda !important;
      color: #155724 !important;
      border-color: #c3e6cb !important;
      font-weight: bold;
    }

    .option-label.incorrect {
      background-color: #f8d7da !important;
      color: #721c24 !important;
      border-color: #f5c6cb !important;
      font-weight: bold;
    }

    .explanation {
      display: none;
      margin-top: 10px;
      padding: 10px 12px;
      background-color: #e8f4f8;
      border-left: 4px solid #2196f3;
      color: #1a365d;
      font-size: 0.95em;
      border-radius: 0 4px 4px 0;
    }

    .btn-container {
      text-align: center;
      margin-top: 20px;
    }

    button {
      padding: 12px 24px;
      font-size: 1em;
      color: #fff;
      background-color: #007bff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    button:hover {
      background-color: #0056b3;
    }

    #score-board {
      text-align: center;
      font-size: 1.4em;
      font-weight: bold;
      margin-bottom: 20px;
      color: #28a745;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Work, Power & Energy Quiz</h1>
    <div id="score-board"></div>
    <form id="quiz-form">
      <div id="quiz-container"></div>
      <div class="btn-container">
        <button type="button" id="submit-btn" onclick="submitQuiz()">Submit Answers</button>
      </div>
    </form>
  </div>

  <script>
    const quizData = [
      {
        id: 1,
        question: "A man moves on a straight horizontal road with a block of mass 2 kg in his hand. If he covers a distance of 40 m with an acceleration of 0.5 m/s², the work done by the man on the block during the motion is (Take g = 10 m/s²):",
        options: ["40 J", "21 J", "80 J", "20 J"],
        answer: "40 J",
        explanation: "Force exerted in the direction of motion is F = m · a = 2 kg × 0.5 m/s² = 1 N[cite: 4]. Work done W = F · d = 1 N × 40 m = 40 J[cite: 4]."
      },
      {
        id: 2,
        question: "In a factory it is desired to lift 2000 kg of metal through a distance of 12 m in 1 minute. The minimum horse power of the engine to be used is:",
        options: ["3.5", "5.3", "4.3", "5.8"],
        answer: "5.3",
        explanation: "Work done W = mgh = 2000 × 9.8 × 12 = 235,200 J[cite: 4]. Power in Watts P = W / t = 235,200 / 60 = 3920 W[cite: 4]. Converting to horsepower (1 HP ≈ 746 W): P = 3920 / 746 ≈ 5.25 HP ≈ 5.3 HP[cite: 4]."
      },
      {
        id: 3,
        question: "Energy harnessed from flowing water is called energy:",
        options: ["Hydel", "Solar", "Tidal", "Geothermal"],
        answer: "Hydel",
        explanation: "Energy produced from flowing or falling water is known as hydroelectric or hydel energy[cite: 4]."
      },
      {
        id: 4,
        question: "The potential energy of a certain spring when stretched through a distance S is 10 joule. The amount of work (in joule) that must be done on this spring to stretch it through additional distance S will be:",
        options: ["30", "40", "10", "20"],
        answer: "30",
        explanation: "Initial potential energy U1 = (1/2)kS² = 10 J[cite: 4]. When stretched to 2S, U2 = (1/2)k(2S)² = 4 × (1/2)kS² = 40 J[cite: 4]. Additional work required W = U2 - U1 = 40 J - 10 J = 30 J[cite: 4]."
      },
      {
        id: 5,
        question: "A machine gun fires six bullets per second into a target. The mass of each bullet is 3 g and the speed is 500 m/s. The power delivered to the bullets is:",
        options: ["1.5 kW", "2.25 kW", "0.75 kW", "375 kW"],
        answer: "2.25 kW",
        explanation: "K.E. per bullet = (1/2)mv² = (1/2) × 0.003 kg × (500 m/s)² = 375 J[cite: 4]. Since 6 bullets are fired per second, total power P = 6 × 375 J/s = 2250 W = 2.25 kW[cite: 4]."
      },
      {
        id: 6,
        question: "Which of the following is the cheapest renewable energy?",
        options: ["Solar energy", "Wind energy", "Hydel energy", "Nuclear energy"],
        answer: "Hydel energy",
        explanation: "Hydel (hydroelectric) energy is widely regarded as one of the most cost-effective renewable energy sources over long operational lifespans[cite: 4]."
      },
      {
        id: 7,
        question: "The energy needed to eject a 50kg spacecraft from the surface of the earth is (radius of the earth is 6.4 × 10⁶ m):",
        options: ["1.1 × 10⁴ J", "1.1 × 10⁹ J", "3.13 × 10⁴ J", "3.13 × 10⁹ J"],
        answer: "3.13 × 10⁹ J",
        explanation: "Energy required to escape E = mgR = 50 kg × 9.8 m/s² × (6.4 × 10⁶ m) ≈ 3.136 × 10⁹ J[cite: 4]."
      },
      {
        id: 8,
        question: "A particle of mass 'm' moves in one dimension along the positive x-axis. It is acted on by a constant force directed towards the origin with magnitude 'B', and an inverse square law repulsive force with magnitude A/x² away from the origin. The equilibrium position x0 of the mass is at:",
        options: ["x0 = 0", "x0 = (A/B)^(1/2)", "x0 = A/B", "x0 = (B/A)^(1/2)"],
        answer: "x0 = (A/B)^(1/2)",
        explanation: "At equilibrium, net force is zero: F_repulsive = F_attractive => A/x0² = B => x0² = A/B => x0 = (A/B)^(1/2)[cite: 4]."
      },
      {
        id: 9,
        question: "Ocean thermal energy is due to:",
        options: [
          "Energy stored by waves in the ocean",
          "Tides arising out in the ocean",
          "Pressure difference at different levels in the ocean",
          "Temperature difference at different levels in the ocean"
        ],
        answer: "Temperature difference at different levels in the ocean",
        explanation: "Ocean thermal energy conversion (OTEC) exploits the temperature difference between warm surface water and cold deep ocean water[cite: 4]."
      },
      {
        id: 10,
        question: "A bucket full of water is drawn up by a person. In this case the work done by the gravitational force is:",
        options: [
          "Negative because the force and displacement are in opposite directions",
          "Positive because the force and displacement are in the same direction",
          "Negative because the force and displacement are the same direction",
          "Positive because the force and displacement are in opposite direction"
        ],
        answer: "Negative because the force and displacement are in opposite directions",
        explanation: "Gravity acts vertically downward while displacement is upward; since the angle between force and displacement is 180°, work done is negative[cite: 4]."
      },
      {
        id: 11,
        question: "When a long spring is stretched by x cm, its potential energy is U. If the spring is stretched by Nx cm, the potential energy stored in it will be:",
        options: ["U/N", "NU", "N2U", "U/N2"],
        answer: "N2U",
        explanation: "Potential energy U ∝ x²[cite: 4]. If stretch increases by factor N (to Nx), new potential energy U' = (1/2)k(Nx)² = N² × (1/2)kx² = N²U[cite: 4]."
      },
      {
        id: 12,
        question: "Which of the following is a non-renewable source of energy?",
        options: ["Coal", "Solar", "Geothermal", "Tidal"],
        answer: "Coal",
        explanation: "Coal is a fossil fuel available in finite quantities and cannot be replenished on a human timescale, making it non-renewable[cite: 4]."
      },
      {
        id: 13,
        question: "A ball of mass 1 kg collides with a wall with speed 8 ms⁻¹ and rebounds on the same line with the same speed. If mass of the wall is taken as infinite, the work done by the ball on the wall is:",
        options: ["6 J", "8 J", "9 J", "zero"],
        answer: "zero",
        explanation: "Since the wall remains stationary (displacement = 0) despite the force exerted, work done on the wall W = F · d = 0 J[cite: 4]."
      },
      {
        id: 14,
        question: "A pump motor is used to deliver water at a certain rate from a given pipe. To obtain thrice as much water from the same pipe in the same time, power of the motor has to be increased:",
        options: ["3 times", "9 times", "27 times", "81 times"],
        answer: "27 times",
        explanation: "For a fluid pump, power P is proportional to the cube of volume flow rate (P ∝ n³)[cite: 4]. Increasing flow rate by 3 times increases power by 3³ = 27 times[cite: 4]."
      },
      {
        id: 15,
        question: "The energy required to accelerate a car from rest to 10 ms⁻¹ is E. What energy will be required to accelerate the car from 10 ms⁻¹ to 20 ms⁻¹?",
        options: ["E", "3E", "5E", "7E"],
        answer: "3E",
        explanation: "E = (1/2)m(10)² - 0 = 50m J[cite: 4]. Energy for 10 to 20 m/s: ΔE = (1/2)m(20² - 10²) = (1/2)m(400 - 100) = 150m J = 3 × 50m = 3E[cite: 4]."
      },
      {
        id: 16,
        question: "A pump can take out 7200 Kg of water per hour from a 100 m deep well. If the efficiency of the pump is 50% then power of the pump is (g = 10 ms⁻²):",
        options: ["2 KW", "4 KW", "7.2 KW", "3.6 KW"],
        answer: "4 KW",
        explanation: "Output power P_out = mgh/t = (7200 × 10 × 100) / 3600 = 2000 W = 2 kW[cite: 4]. Input power P_in = P_out / efficiency = 2 kW / 0.50 = 4 kW[cite: 4]."
      },
      {
        id: 17,
        question: "When a force F = i + 2j + 3k acts on a body to move it from r1 = i + j + k to r2 = i - j + 2k then the work done by the force is:",
        options: ["-3 J", "-1 J", "2 J", "3 J"],
        answer: "-1 J",
        explanation: "Displacement Δr = r2 - r1 = (1-1)i + (-1-1)j + (2-1)k = 0i - 2j + 1k[cite: 4]. Work W = F · Δr = (1)(0) + (2)(-2) + (3)(1) = 0 - 4 + 3 = -1 J[cite: 4]."
      },
      {
        id: 18,
        question: "The K.E. of a body moving with a speed of 10 m/s is 30 J. If its speed becomes 30 m/s then its K.E. will be:",
        options: ["10 J", "90 J", "180 J", "270 J"],
        answer: "270 J",
        explanation: "K.E. ∝ v²[cite: 4]. Tripling the speed (from 10 m/s to 30 m/s) increases K.E. by 3² = 9 times[cite: 4]. New K.E. = 9 × 30 J = 270 J[cite: 4]."
      },
      {
        id: 19,
        question: "A body of mass 2 Kg changes its velocity from 3i + 4j m/s to 6j + 2k m/s. What is the change in kinetic energy of the body?",
        options: ["15 J", "12 J", "18 J", "20 J"],
        answer: "15 J",
        explanation: "Initial v1² = 3² + 4² = 25[cite: 4]. Final v2² = 6² + 2² = 40[cite: 4]. Change in K.E. ΔK = (1/2)m(v2² - v1²) = (1/2)(2)(40 - 25) = 15 J[cite: 4]."
      },
      {
        id: 20,
        question: "At her maximum height a girl in a swing is 3m above the ground and at the lowest point she is 2m above the ground. Her maximum velocity is:",
        options: ["29.4 m/s", "9.8 m/s", "19.6 m/s", "4.4 m/s"],
        answer: "4.4 m/s",
        explanation: "Height difference h = 3m - 2m = 1m[cite: 4]. By conservation of energy: (1/2)mv² = mgh => v = √(2gh) = √(2 × 9.8 × 1) = √19.6 ≈ 4.4 m/s[cite: 4]."
      },
      {
        id: 21,
        question: "An engine delivers 1000 watt of power with 80% efficiency. The input power is:",
        options: ["800 W", "1000 W", "1250 W", "1500 W"],
        answer: "1250 W",
        explanation: "Efficiency η = P_out / P_in => 0.80 = 1000 / P_in => P_in = 1000 / 0.80 = 1250 W[cite: 4]."
      },
      {
        id: 22,
        question: "A body of mass 1 kg starts moving from rest under the action of a force which varies with displacement as F = 2x + 5 (in newtons). The work done by this force to displace the body from x = 0 to x = 2 m is:",
        options: ["18 J", "10 J", "12 J", "14 J"],
        answer: "14 J",
        explanation: "Work done W = ∫(2x + 5)dx from 0 to 2 = [x² + 5x]₀² = (2² + 5(2)) - 0 = 4 + 10 = 14 J[cite: 4]."
      },
      {
        id: 23,
        question: "The potential energy of a particle is given by U(x) = 20 + (x - 2)², where U is in joules and x in meters. The minimum potential energy and the position where it occurs are:",
        options: ["20 J at x = 2 m", "2 J at x = 20 m", "22 J at x = 2 m", "0 J at x = 2 m"],
        answer: "20 J at x = 2 m",
        explanation: "For U(x) = 20 + (x - 2)², minimum occurs when (x - 2)² = 0, which means x = 2 m[cite: 4]. At x = 2, minimum U = 20 J[cite: 4]."
      },
      {
        id: 24,
        question: "Power supplied to a particle of mass 2 kg varies with time as P = 3t²/2 watt, where t is in seconds. If velocity at t = 0 is zero, the velocity at t = 2 s is:",
        options: ["1 m/s", "2 m/s", "3 m/s", "4 m/s"],
        answer: "2 m/s",
        explanation: "Work done W = ∫ P dt = ∫(3t²/2) dt from 0 to 2 = [(3t³/6)]₀² = (1/2)(8) = 4 J[cite: 4]. By work-energy theorem W = (1/2)mv² => 4 = (1/2)(2)v² => v² = 4 => v = 2 m/s[cite: 4]."
      },
      {
        id: 25,
        question: "A pump is used to deliver water at a certain rate from a given pipe. To obtain twice the volume of water from the same pipe in the same time, by what factor must the power of the motor pump be increased? (Assume ideal conditions. g = 10 ms⁻²):",
        options: ["4", "8", "16", "32"],
        answer: "8",
        explanation: "Power of fluid pump P ∝ n³[cite: 4]. To double the volume flow rate (n = 2), power must increase by 2³ = 8 times[cite: 4]."
      }
    ];

    let userScores = {};

    function renderQuiz() {
      const quizContainer = document.getElementById("quiz-container");
      quizContainer.innerHTML = quizData.map((q, index) => `
        <div class="question-card" id="q-card-${q.id}">
          <div class="question-title">${index + 1}. ${q.question}</div>
          <ul class="options-list">
            ${q.options.map(option => `
              <li class="option-item">
                <label class="option-label" id="label-${q.id}-${option.replace(/[^a-zA-Z0-9]/g, '')}">
                  <input type="radio" name="question-${q.id}" value="${option}" onchange="onSelectOption(${q.id}, '${option.replace(/'/g, "\\'")}')">
                  ${option}
                </input>
              </li>
            `).join('')}
          </ul>
          <div class="explanation" id="exp-${q.id}">
            <strong>Explanation:</strong> ${q.explanation}
          </div>
        </div>
      `).join('');
    }

    // Triggered instantly when an option is selected
    function onSelectOption(questionId, selectedValue) {
      const q = quizData.find(item => item.id === questionId);
      const explanationEl = document.getElementById(`exp-${q.id}`);

      // Show explanation immediately
      explanationEl.style.display = "block";

      // Track score state
      if (selectedValue === q.answer) {
        userScores[questionId] = 1;
      } else {
        userScores[questionId] = 0;
      }

      // Update styling instantly & disable choices for this question
      q.options.forEach(option => {
        const sanitizedOpt = option.replace(/[^a-zA-Z0-9]/g, '');
        const label = document.getElementById(`label-${q.id}-${sanitizedOpt}`);
        const input = label.querySelector('input');

        input.disabled = true;

        if (option === q.answer) {
          label.classList.add("correct");
        } else if (option === selectedValue) {
          label.classList.add("incorrect");
        }
      });
    }

    // Called when clicking the Submit button
    function submitQuiz() {
      let finalScore = 0;

      quizData.forEach(q => {
        if (userScores[q.id] === 1) {
          finalScore++;
        }
      });

      const scoreBoard = document.getElementById("score-board");
      scoreBoard.textContent = `Your Final Score: ${finalScore} / ${quizData.length}`;

      const submitBtn = document.getElementById("submit-btn");
      submitBtn.disabled = true;
      submitBtn.style.opacity = "0.6";
      submitBtn.style.cursor = "not-allowed";

      // Smooth scroll back to top to view score
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    window.onload = renderQuiz;
  </script>

</body>
</html>
